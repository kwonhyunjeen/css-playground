<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnetic Spotlight Grid</title>
    <style>
      :root {
        --bg: #0a0a0c;
        --card-bg: #141416;
        --border: rgba(255, 255, 255, 0.04);
        --spotlight: rgba(255, 255, 255, 0.03);
        --font: "Inter", sans-serif;
      }

      body {
        background-color: var(--bg);
        color: #ededef;
        font-family: var(--font);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
        overflow: hidden;
      }

      /* ─── 그리드 레이아웃 ─── */
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        width: 100%;
        max-width: 900px;
        padding: 20px;
      }

      /* ─── 카드의 기본 스타일 (스포트라이트 배경 포함) ─── */
      .card-wrapper {
        position: relative;
        background-color: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;

        /* JS에서 custom property로 마우스 위치를 전달받음 */
        background-image: radial-gradient(
          circle 150px at var(--mouse-x, 50%) var(--mouse-y, 50%),
          var(--spotlight) 0%,
          transparent 100%
        );

        /* 중요: 마우스 거리 기반 반응을 위해 pointer-events를 내부 컨텐츠로 한정 */
        pointer-events: none;
      }

      .card-content {
        padding: 24px;
        height: 140px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;

        /* 내부 컨텐츠는 마우스 이벤트를 받음 */
        pointer-events: auto;

        /* 쫀득한 반응형 Tilt 애니메이션 */
        transition: transform 0.15s cubic-bezier(0.2, 0, 0.2, 1);
        will-change: transform;
      }

      /* ─── 타이포그래피 (Minimal) ─── */
      .card-title {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: -0.01em;
        color: #ededef;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card-title .icon {
        width: 14px;
        height: 14px;
        border-radius: 2px;
      }

      .card-desc {
        font-size: 13px;
        line-height: 1.5;
        color: #a0a0a5;
        margin-top: 8px;
      }

      .card-badge {
        font-size: 11px;
        padding: 4px 10px;
        background: #1e1e21;
        border: 1px solid var(--border);
        border-radius: 100px;
        color: #ededef;
        align-self: flex-start;
      }
    </style>
  </head>
  <body>
    <div class="grid" id="grid">
      <div class="card-wrapper">
        <div class="card-content">
          <div class="card-title">
            <div class="icon" style="background: #3b82f6"></div>
            Magnetic Motion
          </div>
          <div class="card-desc">User interface feels alive and connected.</div>
          <div class="card-badge">Framer Style</div>
        </div>
      </div>
      <div class="card-wrapper">
        <div class="card-content">
          <div class="card-title">
            <div class="icon" style="background: #a855f7"></div>
            Spring Physics
          </div>
          <div class="card-desc">
            Smooth, organic transitions with natural feel.
          </div>
          <div class="card-badge">Linear Touch</div>
        </div>
      </div>
      <div class="card-wrapper">
        <div class="card-content">
          <div class="card-title">
            <div class="icon" style="background: #22c55e"></div>
            Spotlight Effect
          </div>
          <div class="card-desc">Highlight area based on mouse proximity.</div>
          <div class="card-badge">Minimal UI</div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
