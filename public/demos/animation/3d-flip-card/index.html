<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Flip Card</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="section over-hide">
      <div class="container">
        <div class="row full-height justify-content-center">
          <div class="align-self-center col-12 text-center">
            <div class="section py-md-0 py-5 text-center">
              <input
                class="pricing"
                type="checkbox"
                id="pricing"
                name="pricing"
              />
              <label for="pricing"
                ><span class="block-diff"
                  >Swimming<span class="float-right">camping</span></span
                ></label
              >
              <div class="card-3d-wrap mx-auto">
                <div class="card-3d-wrapper">
                  <div class="card-front">
                    <div class="pricing-wrap">
                      <h4 class="mb-4">Swimming</h4>
                      <h2 class="mb-2"><sup>$</sup>39 / 4<sup>hrs</sup></h2>
                      <p class="mb-2">per person</p>
                      <p class="mb-1" style="font-size: 22px">&#x1F4CD;</p>
                      <p class="mb-2">Bondi Beach, Sydney</p>
                      <a href="#0" class="link">Choose Date</a>
                      <div class="img-wrap img-2">
                        <img src="./imgs/sea.png" alt="Sea" />
                      </div>
                      <div class="img-wrap img-1">
                        <img src="./imgs/swimming.png" alt="Swimming" />
                      </div>
                      <div class="img-wrap img-3">
                        <img src="./imgs/water.png" alt="Water" />
                      </div>
                      <div class="img-wrap img-6">
                        <img src="./imgs/tube.png" alt="Tube" />
                      </div>
                    </div>
                  </div>
                  <div class="card-back">
                    <div class="pricing-wrap">
                      <h4 class="mb-4">Camping</h4>
                      <h2 class="mb-2"><sup>$</sup>29 / 8<sup>hrs</sup></h2>
                      <p class="mb-2">per person</p>
                      <p class="mb-1" style="font-size: 22px">&#x1F4CD;</p>
                      <p class="mb-2">Tara, Serbia</p>
                      <a href="#0" class="link">Choose Date</a>
                      <div class="img-wrap img-2">
                        <img src="./imgs/grass.png" alt="Grass" />
                      </div>
                      <div class="img-wrap img-4">
                        <img src="./imgs/camp.png" alt="Camp" />
                      </div>
                      <div class="img-wrap img-5">
                        <img src="./imgs/ivy.png" alt="ivy" />
                      </div>
                      <div class="img-wrap img-7">
                        <img src="./imgs/rock.png" alt="Rock" />
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
