<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premium Wellness & Sleep App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="device-mockup">
      <div class="device-notch"></div>

      <div class="app-container">
        <aside class="sidebar">
          <h2>Wellness</h2>
          <ul>
            <li>Profile <span>›</span></li>
            <li>Sleep Goals <span>›</span></li>
            <li>Apple Health <span>›</span></li>
            <li>Settings <span>›</span></li>
          </ul>

          <button class="theme-toggle" id="themeToggleBtn">
            <div class="icon-wrapper">
              <svg
                class="morph-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="white"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <mask id="moon-mask">
                  <rect x="0" y="0" width="24" height="24" fill="white" />
                  <circle
                    class="moon-shadow"
                    cx="16"
                    cy="8"
                    r="6"
                    fill="black"
                    stroke="none"
                  />
                </mask>
                <circle
                  class="core"
                  cx="12"
                  cy="12"
                  r="5"
                  fill="white"
                  stroke="none"
                  mask="url(#moon-mask)"
                />
                <g class="rays" stroke="white">
                  <line x1="12" y1="1" x2="12" y2="3"></line>
                  <line x1="12" y1="21" x2="12" y2="23"></line>
                  <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                  <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                  <line x1="1" y1="12" x2="3" y2="12"></line>
                  <line x1="21" y1="12" x2="23" y2="12"></line>
                  <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                  <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </g>
              </svg>
            </div>
          </button>
        </aside>

        <main class="main-panel dark-mode" id="mainPanel">
          <div class="bg-orb o1"></div>
          <div class="bg-orb o2"></div>
          <div class="bg-orb o3"></div>
          <div class="bg-orb o4"></div>
          <div class="noise-layer"></div>

          <div class="content-wrapper" id="contentWrapper">
            <div class="content-header">
              <div class="greeting" id="greetingText">Good evening,</div>
              <h1 class="user-name">Alexander</h1>
            </div>

            <div class="hero-card glass-panel">
              <div class="glare-top"></div>
              <span class="hero-label" id="heroLabel">Sleep Score</span>
              <span class="hero-value" id="heroValue">85</span>
              <span class="hero-sub" id="heroSub">Optimal sleep quality</span>
            </div>

            <div class="section-title" id="sectionTitle">Wind Down</div>

            <div class="action-card glass-panel">
              <div class="glare-top"></div>
              <div class="card-icon" id="card1Icon">🌌</div>
              <div class="card-info">
                <div class="card-title" id="card1Title">Deep Sleep Sounds</div>
                <div class="card-desc" id="card1Desc">
                  45 Min • Ambient noise
                </div>
              </div>
            </div>

            <div class="action-card glass-panel">
              <div class="glare-top"></div>
              <div class="card-icon" id="card2Icon">🌬️</div>
              <div class="card-info">
                <div class="card-title" id="card2Title">Night Breathwork</div>
                <div class="card-desc" id="card2Desc">10 Min • Relaxing</div>
              </div>
            </div>

            <nav class="bottom-action-bar glass-panel">
              <div class="glare-top"></div>
              <svg
                class="nav-icon active"
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <svg
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
              <svg
                class="nav-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                <line x1="9" y1="9" x2="9.01" y2="9"></line>
                <line x1="15" y1="9" x2="15.01" y2="9"></line>
              </svg>
            </nav>
          </div>
        </main>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
