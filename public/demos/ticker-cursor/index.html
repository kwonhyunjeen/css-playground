<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circular Ticker Cursor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="gallery">
      <div
        class="card"
        data-ticker="• SPIDER MAN 🕸 🗽 🕷 • SPIDER MAN 🕸 🗽 🕷 "
        style="background-image: url(&quot;./imgs/spiderman.jpg&quot;)"
      ></div>
      <div
        class="card"
        data-ticker="• TOY STORY 🥔 🛸 🦖 • TOY STORY 🥔 🛸 🦖 "
        style="background-image: url(&quot;./imgs/toystory.jpg&quot;)"
      ></div>
      <div
        class="card"
        data-ticker="• DOOMS DAY 💥 🌋 💀 • DOOMS DAY 💥 🌋 💀 "
        style="background-image: url(&quot;./imgs/doomsday.jpeg&quot;)"
      ></div>
    </div>

    <div class="cursor-tracker" id="cursorTracker">
      <div class="cursor-visual" id="cursorVisual">
        <div class="cursor-text-wrapper" id="cursorTextWrapper"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
