<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magnetic Spotlight Grid</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="grid" id="grid">
      <div class="card-wrapper">
        <div class="card-content">
          <div class="card-title">
            <div class="icon" style="background: #3b82f6"></div>
            Magnetic Motion
          </div>
          <div class="card-desc">User interface feels alive and connected.</div>
          <div class="card-badge">Framer Style</div>
        </div>
      </div>
      <div class="card-wrapper">
        <div class="card-content">
          <div class="card-title">
            <div class="icon" style="background: #a855f7"></div>
            Spring Physics
          </div>
          <div class="card-desc">
            Smooth, organic transitions with natural feel.
          </div>
          <div class="card-badge">Linear Touch</div>
        </div>
      </div>
      <div class="card-wrapper">
        <div class="card-content">
          <div class="card-title">
            <div class="icon" style="background: #22c55e"></div>
            Spotlight Effect
          </div>
          <div class="card-desc">Highlight area based on mouse proximity.</div>
          <div class="card-badge">Minimal UI</div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
