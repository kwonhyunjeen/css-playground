<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Loading & Image Reveal</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>

    <section class="reveal-section">
      <div class="reveal-wrap">
        <img src="./imgs/on.jpg" alt="On" class="reveal-image" />

      <div class="reveal-wrap">
        <img src="./imgs/salomon.jpg" alt="Salomon" class="reveal-image" />

    <section class="reveal-section">
      <div class="reveal-wrap">
        <img src="./imgs/satisfy.jpg" alt="Satisfy" class="reveal-image" />
      </div>
    </section>

    <section class="reveal-section">
      <div class="reveal-wrap">
        <img src="./imgs/nike.jpg" alt="Nike" class="reveal-image" />
      </div>
    </section>

    <section class="reveal-section">
      <div class="reveal-wrap">
        <img src="./imgs/lululemon.jpg" alt="Lululemon" class="reveal-image" />
      </div>
    </section>

    <script src="./scrpt.js"></script>
