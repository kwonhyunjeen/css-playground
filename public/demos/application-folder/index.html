<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Folder</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="device-mockup">
      <div class="device-notch"></div>
      <div class="focus-overlay" id="overlay"></div>

      <div class="folder" id="folder">
        <span><ion-icon name="camera-outline"></ion-icon></span>
        <span><ion-icon name="home-outline"></ion-icon></span>
        <span><ion-icon name="heart-outline"></ion-icon></span>
        <span><ion-icon name="image-outline"></ion-icon></span>
        <span><ion-icon name="battery-charging-outline"></ion-icon></span>
        <span><ion-icon name="alarm-outline"></ion-icon></span>
        <span><ion-icon name="calculator-outline"></ion-icon></span>
        <span><ion-icon name="calendar-outline"></ion-icon></span>
        <span><ion-icon name="chatbubbles-outline"></ion-icon></span>
      </div>
    </div>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
