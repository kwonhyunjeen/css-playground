<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trace Border Button</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a href="#" class="circle-btn">
      <div class="circle-bg"></div>

      <svg class="circle-svg" viewBox="0 0 160 160">
        <circle class="circle-draw" cx="80" cy="80" r="78"></circle>
      </svg>

      <div class="pencil-default">
        <i class="fa-solid fa-pen pencil-icon"></i>
      </div>

      <div class="pencil-wrapper">
        <i class="fa-solid fa-pen pencil-icon pencil-anim"></i>
      </div>

      <span class="btn-text">HOVER</span>
    </a>
  </body>
</html>
