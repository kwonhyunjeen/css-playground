<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Cursor Trail</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="mobile-frame" id="appFrame">
      <canvas class="lines-canvas" id="linesCanvas"></canvas>

      <div class="cursor" id="cursor"></div>

      <div class="header">
        <div class="header-title">Interaction <span>Snake</span></div>
      </div>

      <div class="hint" id="hint">Touch & Drag</div>

      <div class="controls" id="controlsPanel">
        <div class="control-row">
          <span class="control-label">Stiffness</span>
          <input
            type="range"
            id="stiffness"
            min="10"
            max="300"
            value="150"
            step="1"
          />
          <span class="control-value" id="stiffVal">150</span>
        </div>
        <div class="control-row">
          <span class="control-label">Damping</span>
          <input
            type="range"
            id="damping"
            min="2"
            max="40"
            value="16"
            step="1"
          />
          <span class="control-value" id="dampVal">16</span>
        </div>
        <div
          class="control-row"
          style="justify-content: center; margin-top: 4px"
        >
          <div class="count-controls">
            <button class="count-btn" id="countDec">−</button>
            <span class="control-label" style="width: auto; margin: 0 4px"
              >Nodes:
              <span id="countVal" style="color: var(--text)">12</span></span
            >
            <button class="count-btn" id="countInc">+</button>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
